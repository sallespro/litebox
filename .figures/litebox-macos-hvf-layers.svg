<svg viewBox="0 0 680 940" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="680" height="940" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- external endpoints -->
<rect x="40" y="12" width="260" height="48" rx="8" fill="#f4f4f2" stroke="#bbb"/>
<text x="170" y="33" text-anchor="middle" font-size="14" font-weight="500" fill="#111">Host browser</text>
<text x="170" y="50" text-anchor="middle" font-size="12" fill="#666">http://10.0.0.2:8080</text>
<rect x="380" y="12" width="260" height="48" rx="8" fill="#f4f4f2" stroke="#bbb"/>
<text x="510" y="33" text-anchor="middle" font-size="14" font-weight="500" fill="#111">OpenAI API</text>
<text x="510" y="50" text-anchor="middle" font-size="12" fill="#666">api.openai.com · sites the agent fetches</text>
<line x1="170" y1="60" x2="170" y2="98" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<text x="182" y="84" font-size="12" fill="#666">HTTP over utun</text>
<line x1="510" y1="60" x2="510" y2="98" stroke="#666" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="522" y="84" font-size="12" fill="#666">rootless outbound proxy</text>

<!-- guest -->
<rect x="30" y="100" width="620" height="404" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="46" y="121" font-size="12" font-weight="500" fill="#085041">LAYER 5 · GUEST (Linux aarch64, unmodified binaries)</text>

<!-- web mode -->
<rect x="50" y="134" width="250" height="312" rx="8" fill="#9FE1CB" stroke="#0F6E56"/>
<text x="62" y="154" font-size="12" font-weight="500" fill="#085041">WEB MODE · litebox-serve / deep-box</text>
<rect x="62" y="166" width="226" height="80" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="175" y="192" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Node http server</text>
<text x="175" y="212" text-anchor="middle" font-size="12" fill="#085041">serves /www (a directory)</text>
<text x="175" y="228" text-anchor="middle" font-size="12" fill="#085041">or the built-in dashboard</text>
<rect x="62" y="258" width="226" height="80" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="175" y="284" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Dashboard UI</text>
<text x="175" y="304" text-anchor="middle" font-size="12" fill="#085041">webjsx + AnEntrypoint design</text>
<text x="175" y="320" text-anchor="middle" font-size="12" fill="#085041">xterm.js terminals</text>
<rect x="62" y="350" width="226" height="84" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="175" y="376" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">htop · shell</text>
<text x="175" y="396" text-anchor="middle" font-size="12" fill="#085041">PTYs via socat</text>
<text x="175" y="412" text-anchor="middle" font-size="12" fill="#085041">streamed over SSE</text>

<!-- agent mode -->
<rect x="320" y="134" width="310" height="312" rx="8" fill="#F5C4B3" stroke="#993C1D"/>
<text x="332" y="154" font-size="12" font-weight="500" fill="#712B13">AGENT MODE · deep-box --agent</text>
<rect x="332" y="164" width="286" height="54" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="475" y="187" text-anchor="middle" font-size="13" font-weight="500" fill="#4A1B0C">dsh-dynamic-agent.mjs</text>
<text x="475" y="206" text-anchor="middle" font-size="12" fill="#712B13">DeepSeekHarness SDK client · one turn</text>
<line x1="475" y1="218" x2="475" y2="238" stroke="#712B13" stroke-width="1.5" marker-end="url(#a)"/>
<text x="487" y="232" font-size="11" fill="#712B13">stdio JSON-RPC</text>
<rect x="332" y="240" width="286" height="194" rx="6" fill="#FAECE7" stroke="#993C1D"/>
<text x="344" y="259" font-size="12" font-weight="500" fill="#4A1B0C">dsh runtime · profile "sdk"</text>
<rect x="344" y="268" width="262" height="30" rx="5" fill="#F5C4B3" stroke="#993C1D"/>
<text x="475" y="288" text-anchor="middle" font-size="12" fill="#4A1B0C">dsh-base bundle · agent loop, sessions</text>
<rect x="344" y="304" width="262" height="30" rx="5" fill="#F5C4B3" stroke="#993C1D"/>
<text x="475" y="324" text-anchor="middle" font-size="12" fill="#4A1B0C">plugin llm-pi-ai · OpenAI route</text>
<rect x="344" y="340" width="262" height="40" rx="5" fill="#F5C4B3" stroke="#993C1D"/>
<text x="475" y="357" text-anchor="middle" font-size="12" fill="#4A1B0C">plugin dynamic-web-fetch · fetch_url tool</text>
<text x="475" y="372" text-anchor="middle" font-size="11" fill="#712B13">written at runtime, mounted via patch</text>
<rect x="344" y="386" width="262" height="40" rx="5" fill="#F5C4B3" stroke="#993C1D"/>
<text x="475" y="403" text-anchor="middle" font-size="12" fill="#4A1B0C">plugin tool-subagent · "researcher"</text>
<text x="475" y="418" text-anchor="middle" font-size="11" fill="#712B13">child agent, tools limited to fetch_url</text>

<!-- shared runtime bar -->
<rect x="50" y="458" width="580" height="34" rx="6" fill="#9FE1CB" stroke="#0F6E56"/>
<text x="340" y="479" text-anchor="middle" font-size="13" fill="#04342C">Node v26 (V8) · Alpine userland (musl, busybox) · Linux syscalls (SVC #0)</text>

<line x1="340" y1="504" x2="340" y2="530" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

<!-- HVF -->
<rect x="30" y="532" width="620" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
<text x="46" y="554" font-size="12" font-weight="500" fill="#3C3489">LAYER 4 · HVF GUEST EXECUTION</text>
<text x="46" y="577" font-size="13" fill="#3C3489">Guest runs natively on a vCPU (EL0) · tiny EL1 monitor traps SVC and hands it to the shim</text>
<text x="46" y="593" font-size="12" fill="#534AB7">16 KiB pages, compact IPA, stage-1/2 tables, no instruction emulation</text>
<line x1="340" y1="602" x2="340" y2="624" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

<!-- shim -->
<rect x="30" y="626" width="620" height="70" rx="12" fill="#FAEEDA" stroke="#854F0B"/>
<text x="46" y="648" font-size="12" font-weight="500" fill="#633806">LAYER 3 · NORTH: litebox_shim_linux</text>
<text x="46" y="671" font-size="13" fill="#633806">Linux syscall ABI: files, mmap/msync, threads, signals, PTYs, sockets (smoltcp TCP/IP)</text>
<text x="46" y="687" font-size="12" fill="#854F0B">Rootfs served from the packaged tar · guest IP 10.0.0.2</text>
<line x1="340" y1="696" x2="340" y2="718" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

<!-- platform -->
<rect x="30" y="720" width="620" height="84" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
<text x="46" y="742" font-size="12" font-weight="500" fill="#0C447C">LAYER 2 · SOUTH: litebox_platform_macos_userland (the runner process)</text>
<text x="46" y="765" font-size="13" fill="#0C447C">Memory, threads, time via macOS APIs · utun (web) · outbound proxy (agent)</text>
<text x="46" y="781" font-size="12" fill="#185FA5">Signed with the hypervisor entitlement · Seatbelt sandbox · launched by the deep-box binary,</text>
<text x="46" y="796" font-size="12" fill="#185FA5">which embeds the runner, rootfs and agent and stages the .env as a file</text>
<line x1="340" y1="804" x2="340" y2="826" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

<!-- host -->
<rect x="30" y="828" width="620" height="80" rx="12" fill="#f4f4f2" stroke="#bbb"/>
<text x="46" y="850" font-size="12" font-weight="500" fill="#666">LAYER 1 · HOST</text>
<text x="46" y="873" font-size="13" fill="#111">macOS 26 · Apple Silicon (aarch64)</text>
<text x="46" y="891" font-size="12" fill="#666">Hypervisor.framework · Mach/BSD kernel · utun9 (10.0.0.1 ↔ 10.0.0.2) in web mode</text>

<text x="340" y="928" text-anchor="middle" font-size="12" fill="#666">Guest instructions run natively; only the system interface is virtualised.</text>
</svg>
